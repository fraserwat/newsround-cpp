name: Install Dependencies
description: >
  Install build-time dependencies. This is the single source of truth for
  required libraries. When adding a dependency, update this file AND the
  Dockerfile (build stage for libdeps, runtime stage for shared libs).

runs:
  using: composite
  steps:
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev librocksdb-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install curl rocksdb
